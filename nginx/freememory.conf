# Redirect freememory.in → freememory.app (HTTPS)
server {
    listen 443 ssl;
    server_name freememory.in www.freememory.in www.freememory.app;

    ssl_certificate /etc/letsencrypt/live/freememory.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freememory.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://freememory.app$request_uri;
}

# Serve freememory.app (HTTPS)
server {
    listen 443 ssl;
    server_name freememory.app;

    root /var/www/freememory;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    ssl_certificate /etc/letsencrypt/live/freememory.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freememory.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP → HTTPS redirect for all domains
server {
    listen 80;
    server_name freememory.app www.freememory.app freememory.in www.freememory.in;

    return 301 https://freememory.app$request_uri;
}
